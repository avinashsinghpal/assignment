apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongodb-allow-flask-only
  namespace: flask-app
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: assignment
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  policyTypes:
    - Ingress
  ingress:
    # Allow incoming traffic on port 27017 strictly from pods labeled app.kubernetes.io/name: flask-app
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flask-app
      ports:
        - protocol: TCP
          port: 27017
