apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: assignment
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/mongo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: flask-app
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: assignment
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
