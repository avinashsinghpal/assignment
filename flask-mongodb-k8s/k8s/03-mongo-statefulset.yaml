apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: flask-app
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: assignment
spec:
  serviceName: mongodb-service
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:latest
          imagePullPolicy: IfNotPresent
          args:
            - mongod
            - --bind_ip_all
            - --wiredTigerCacheSizeGB
            - "0.25"
          ports:
            - containerPort: 27017
              name: mongodb
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-username
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongo-root-password
          resources:
            requests:
              cpu: 200m
              memory: 250M
            limits:
              cpu: 500m
              memory: 500M
          volumeMounts:
            - name: mongo-storage
              mountPath: /data/db
          startupProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: 27017
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: mongo-storage
          persistentVolumeClaim:
            claimName: mongo-pvc
