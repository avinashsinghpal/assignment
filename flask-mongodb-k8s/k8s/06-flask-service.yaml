apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: flask-app
  labels:
    app.kubernetes.io/name: flask-app
    app.kubernetes.io/part-of: assignment
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: flask-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30005
      name: http
